<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio Video TikTok &amp; Reels — brunorachiele.it</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

  <div class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <!-- Pannello Controlli -->
    <div class="lg:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-[11px] font-extrabold uppercase tracking-wider text-blue-400">Studio Video Verticale 9:16 • Teaser</span>
          <h1 class="text-xl font-black">Generatore Anteprime TikTok &amp; Reels</h1>
          <p class="text-xs text-slate-400">Anteprime ad alto impatto per <span class="text-white font-semibold">brunorachiele.it</span></p>
        </div>
        <a href="index.html" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">← Archivio</a>
      </div>

      <!-- Selettore Tipo di Video (3 Schede) -->
      <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
        <button type="button" onclick="switchTab('partiti')" id="tab-partiti" class="tab-btn py-2 px-2 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow">
          <i class="fa-solid fa-chart-simple mr-1"></i> Partiti
        </button>
        <button type="button" onclick="switchTab('leader')" id="tab-leader" class="tab-btn py-2 px-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-white">
          <i class="fa-solid fa-user-tie mr-1"></i> Leader
        </button>
        <button type="button" onclick="switchTab('stabilicum')" id="tab-stabilicum" class="tab-btn py-2 px-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-white">
          <i class="fa-solid fa-landmark mr-1"></i> Stabilicum
        </button>
      </div>

      <!-- PANNELLO 1: PARTITI (TEASER) -->
      <div id="panel-partiti" class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Data Rilevazione (da GitHub)</label>
            <select id="sel-date" onchange="onDateChange()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Taglio Anteprima (Non svela tutto)</label>
            <select id="sel-partiti-submode" onchange="onPartitiModeChange()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold">
              <option value="top3">Podio Top 3 + Card Bloccata</option>
              <option value="duello">Duello Testa a Testa (1° vs 2°)</option>
              <option value="movers3">Top 3 Variazioni (Chi sale / Chi scende)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- PANNELLO 2: GRADIMENTO LEADER -->
      <div id="panel-leader" class="hidden space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-[11px] font-bold uppercase text-slate-400">Incolla Gradimento Leader (Nome • % • Variazione opzionale)</label>
          <span class="text-[10px] text-blue-400 font-bold">Mostra i primi 4 in classifica</span>
        </div>
        <textarea id="in-leader-data" rows="4" oninput="drawFrame(1)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-white">Giorgia Meloni&#9;43,5&#9;+0,3
Antonio Tajani&#9;38,2&#9;+0,1
Elly Schlein&#9;31,4&#9;-0,2
Giuseppe Conte&#9;30,8&#9;0,0</textarea>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Sottotitolo / Data</label>
            <input id="in-leader-sub" type="text" oninput="drawFrame(1)" value="GRADIMENTO LEADER POLITICI" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Mostra card bloccata finale</label>
            <select id="sel-leader-lock" onchange="drawFrame(1)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold">
              <option value="yes">Sì (Altri leader sul sito)</option>
              <option value="no">No (Mostra solo i dati inseriti)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- PANNELLO 3: SCENARI STABILICUM -->
      <div id="panel-stabilicum" class="hidden space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-[11px] font-bold uppercase text-slate-400">Righe Scenario (Nome Coalizione/Lista • Voti % • Seggi Camera)</label>
          <span class="text-[10px] text-emerald-400 font-bold">Soglia Maggioranza: 201</span>
        </div>
        <textarea id="in-stab-data" rows="4" oninput="drawFrame(1)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-white">CAMPO LARGO&#9;44,5&#9;220
CENTRODESTRA&#9;43,6&#9;139
FUTURO NAZIONALE&#9;5,6&#9;18
AZIONE&#9;1,0&#9;3</textarea>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Etichetta Scenario</label>
            <input id="in-stab-sub" type="text" oninput="drawFrame(1)" value="SIMULAZIONE STABILICUM • CAMERA" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Preset Veloce Scenario</label>
            <select onchange="loadStabPreset(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold">
              <option value="s1">Scenario 1: Coalizioni separate</option>
              <option value="s2">Scenario 2: CDX + Futuro Nazionale</option>
              <option value="s3">Scenario 3: Campo Largo + Terzo Polo</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Impostazioni Grafiche Comuni -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-800">
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Titolo Hook (in alto sul video)</label>
          <input id="in-hook" type="text" oninput="drawFrame(1)" value="SONDAGGI POLITICI: ECCO IL PODIO DELLA SETTIMANA" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Stile Sfondo</label>
          <select id="sel-theme" onchange="drawFrame(1)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold">
            <option value="dark">Blu Istituzionale Scuro (Consigliato TikTok)</option>
            <option value="light">Editoriale Chiaro (Stile brunorachiele.it)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Call to Action finale (Invito al sito)</label>
        <input id="in-cta" type="text" oninput="drawFrame(1)" value="Tutti i dati completi su brunorachiele.it" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs">
      </div>

      <div class="flex flex-wrap gap-2.5 pt-2">
        <button type="button" onclick="playPreview()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-extrabold py-3 px-4 rounded-xl inline-flex items-center justify-center gap-2">
          <i class="fa-solid fa-play text-emerald-400"></i> Anteprima (10s)
        </button>
        <button type="button" id="btn-record" onclick="recordAndDownload()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-xs font-extrabold py-3 px-4 rounded-xl inline-flex items-center justify-center gap-2 shadow-lg">
          <i class="fa-solid fa-video"></i> Registra e Scarica Video
        </button>
      </div>

      <div id="rec-status" class="hidden text-xs font-bold p-3 rounded-xl bg-blue-950/80 border border-blue-800 text-blue-200"></div>
    </div>

    <!-- Anteprima Verticale 9:16 -->
    <div class="lg:col-span-6 flex flex-col items-center">
      <div class="text-[11px] font-bold uppercase text-slate-400 mb-2">Anteprima Formato TikTok / Reels / Shorts (1080×1920)</div>
      <div class="border-4 border-slate-800 rounded-[28px] overflow-hidden shadow-2xl bg-black" style="width: 324px; height: 576px;">
        <canvas id="tiktok-canvas" width="1080" height="1920" style="width: 324px; height: 576px; display: block;"></canvas>
      </div>
    </div>

  </div>

  <script>
    const CSV_URL = "storico_supermedia_brunorachiele.csv";

    const PARTY_COLORS = {
      "Fratelli d'Italia": "#0f294a",
      "Partito Democratico": "#dc2626",
      "Movimento 5 Stelle": "#eab308",
      "Forza Italia": "#0284c7",
      "Lega": "#16a34a",
      "Alleanza Verdi-Sinistra": "#15803d",
      "Azione": "#2563eb",
      "Italia Viva": "#db2777",
      "+Europa": "#f59e0b",
      "Noi Moderati": "#0ea5e9",
      "Futuro Nazionale": "#475569",
      "Sud Chiama Nord": "#7c3aed"
    };

    const PARTY_SIGLE = {
      "Fratelli d'Italia": "FdI",
      "Partito Democratico": "PD",
      "Movimento 5 Stelle": "M5S",
      "Forza Italia": "FI",
      "Lega": "LEGA",
      "Alleanza Verdi-Sinistra": "AVS",
      "Azione": "AZ",
      "Italia Viva": "IV",
      "+Europa": "+EU",
      "Noi Moderati": "NM",
      "Futuro Nazionale": "FN",
      "Sud Chiama Nord": "SCN"
    };

    const LEADER_COLORS = ["#0b4a9f", "#0284c7", "#dc2626", "#eab308", "#16a34a", "#7c3aed", "#db2777"];
    const ACTIVE_KEYS = Object.keys(PARTY_COLORS);

    let currentTab = "partiti";
    let records = [];
    let selectedIndex = 0;
    let animFrameId = null;

    function getTodayItalyISO() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const m = {};
      parts.forEach(function(p) { m[p.type] = p.value; });
      return m.year + "-" + m.month + "-" + m.day;
    }

    async function init() {
      try {
        const res = await fetch(CSV_URL + "?t=" + Date.now());
        const text = await res.text();
        const lines = text.trim().split(/\r?\n/);
        const headers = lines[0].split(",").map(function(h) { return h.trim(); });
        const todayISO = getTodayItalyISO();

        records = lines.slice(1).map(function(l) {
          const cols = l.split(",");
          const obj = {};
          headers.forEach(function(h, i) {
            const v = (cols[i] || "").trim();
            obj[h] = (h === "data" || h === "data_it") ? v : (v === "" ? null : parseFloat(v));
          });
          return obj;
        }).filter(function(r) {
          return r.data && r.data <= todayISO;
        }).sort(function(a, b) {
          return a.data.localeCompare(b.data);
        });

        const sel = document.getElementById("sel-date");
        records.slice().reverse().forEach(function(r, idx) {
          const opt = document.createElement("option");
          opt.value = records.length - 1 - idx;
          opt.textContent = "Supermedia del " + r.data_it;
          sel.appendChild(opt);
        });
        selectedIndex = records.length - 1;
      } catch (e) {}
      drawFrame(1);
    }

    function switchTab(tab) {
      currentTab = tab;
      ["partiti", "leader", "stabilicum"].forEach(function(t) {
        const btn = document.getElementById("tab-" + t);
        const panel = document.getElementById("panel-" + t);
        if (t === tab) {
          btn.className = "tab-btn py-2 px-2 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow";
          panel.classList.remove("hidden");
        } else {
          btn.className = "tab-btn py-2 px-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-white";
          panel.classList.add("hidden");
        }
      });

      if (tab === "partiti") {
        onPartitiModeChange();
      } else if (tab === "leader") {
        document.getElementById("in-hook").value = "CHI È IL LEADER PIÙ AMATO DAGLI ITALIANI?";
        document.getElementById("in-cta").value = "La classifica completa dei leader su brunorachiele.it";
      } else if (tab === "stabilicum") {
        document.getElementById("in-hook").value = "CHI VINCE CON LA NUOVA LEGGE STABILICUM?";
        document.getElementById("in-cta").value = "Guarda tutti gli scenari di voto su brunorachiele.it";
      }
      drawFrame(1);
    }

    function onDateChange() {
      selectedIndex = parseInt(document.getElementById("sel-date").value, 10);
      drawFrame(1);
    }

    function onPartitiModeChange() {
      const sub = document.getElementById("sel-partiti-submode").value;
      if (sub === "top3") {
        document.getElementById("in-hook").value = "SONDAGGI POLITICI: ECCO IL PODIO DELLA SETTIMANA";
      } else if (sub === "duello") {
        document.getElementById("in-hook").value = "TESTA A TESTA NEI SONDAGGI: CHI È DAVANTI?";
      } else {
        document.getElementById("in-hook").value = "CHI SALE E CHI SCENDE NEI SONDAGGI OGGI";
      }
      document.getElementById("in-cta").value = "Tutti i partiti e lo storico dal 2020 su brunorachiele.it";
      drawFrame(1);
    }

    function loadStabPreset(val) {
      const ta = document.getElementById("in-stab-data");
      if (val === "s1") {
        ta.value = "CAMPO LARGO\t44,5\t220\nCENTRODESTRA\t43,6\t139\nFUTURO NAZIONALE\t5,6\t18\nAZIONE\t1,0\t3";
      } else if (val === "s2") {
        ta.value = "CENTRODESTRA + FN\t49,2\t220\nCAMPO LARGO\t38,3\t122\nITALIA VIVA\t6,1\t20\nAZIONE\t1,0\t3";
      } else {
        ta.value = "CENTRODESTRA + FN\t49,2\t220\nCAMPO LARGO + TERZO POLO\t45,5\t145";
      }
      drawFrame(1);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      let curY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, curY);
          line = words[n] + " ";
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, curY);
      return curY;
    }

    function getInitials(name) {
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 3).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function drawLockedTeaserCard(ctx, y, isDark, labelText, subText, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = isDark ? "rgba(30, 41, 59, 0.55)" : "#f1f5f9";
      roundRect(ctx, 70, y, 940, 145, 24);
      ctx.fill();

      ctx.setLineDash([10, 8]);
      ctx.strokeStyle = isDark ? "#475569" : "#94a3b8";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.setLineDash([]);

      // Cerchio lucchetto
      ctx.fillStyle = "#2563eb";
      ctx.beginPath();
      ctx.arc(145, y + 72, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🔒", 145, y + 83);
      ctx.textAlign = "left";

      ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
      ctx.font = "800 32px sans-serif";
      ctx.fillText(labelText, 205, y + 66);

      ctx.fillStyle = isDark ? "#93c5fd" : "#0b4a9f";
      ctx.font = "700 25px sans-serif";
      ctx.fillText(subText, 205, y + 106);
      ctx.restore();
    }

    function drawFrame(progress) {
      const canvas = document.getElementById("tiktok-canvas");
      const ctx = canvas.getContext("2d");
      const W = 1080, H = 1920;
      const isDark = document.getElementById("sel-theme").value === "dark";
      const hookText = document.getElementById("in-hook").value.trim() || "SONDAGGI POLITICI";
      const ctaText = document.getElementById("in-cta").value.trim() || "brunorachiele.it";

      // Sfondo
      if (isDark) {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "#080e1e");
        grad.addColorStop(1, "#0f172a");
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = "#f8fafc";
      }
      ctx.fillRect(0, 0, W, H);

      // Pill Brand
      ctx.fillStyle = "#0b4a9f";
      roundRect(ctx, 70, 120, 410, 62, 31);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 28px sans-serif";
      ctx.fillText("BRUNORACHIELE.IT", 106, 161);

      // Pill Categoria / Data
      let pillRightText = "SUPERMEDIA";
      if (currentTab === "partiti" && records[selectedIndex]) {
        pillRightText = "SUPERMEDIA • " + records[selectedIndex].data_it;
      } else if (currentTab === "leader") {
        pillRightText = document.getElementById("in-leader-sub").value.trim().toUpperCase() || "GRADIMENTO LEADER";
      } else if (currentTab === "stabilicum") {
        pillRightText = document.getElementById("in-stab-sub").value.trim().toUpperCase() || "SIMULAZIONE STABILICUM";
      }

      ctx.fillStyle = isDark ? "#1e293b" : "#e2e8f0";
      roundRect(ctx, 500, 120, 510, 62, 31);
      ctx.fill();
      ctx.fillStyle = isDark ? "#93c5fd" : "#0f172a";
      ctx.font = "800 24px sans-serif";
      ctx.fillText(pillRightText.slice(0, 28), 530, 160);

      // Titolo Hook
      ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
      ctx.font = "900 58px sans-serif";
      const endTitleY = wrapText(ctx, hookText.toUpperCase(), 70, 275, 940, 72);

      const startY = endTitleY + 60;
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(70, startY - 26, 150, 8);

      // === RENDER 1: PARTITI (SOLO ANTEPRIMA TEASER) ===
      if (currentTab === "partiti" && records[selectedIndex]) {
        const cur = records[selectedIndex];
        const prev = selectedIndex > 0 ? records[selectedIndex - 1] : null;
        const submode = document.getElementById("sel-partiti-submode").value;

        let items = ACTIVE_KEYS.filter(function(k) {
          return cur[k] !== null && cur[k] !== undefined;
        }).map(function(k) {
          const v = cur[k];
          const pv = prev ? prev[k] : null;
          const diff = (pv !== null && pv !== undefined) ? +(v - pv).toFixed(2) : 0;
          return { name: k, sigla: PARTY_SIGLE[k] || k.slice(0, 3), val: v, diff: diff, color: PARTY_COLORS[k] || "#2563eb" };
        });

        if (submode === "movers3") {
          items = items.filter(function(it) { return it.diff !== 0; })
            .sort(function(a, b) { return Math.abs(b.diff) - Math.abs(a.diff); })
            .slice(0, 3);
        } else {
          items.sort(function(a, b) { return b.val - a.val; });
          items = items.slice(0, submode === "duello" ? 2 : 3);
        }

        const maxVal = Math.max.apply(null, items.map(function(it) { return it.val; }).concat([30]));
        const cardH = submode === "duello" ? 235 : 195;
        const gap = 26;

        items.forEach(function(it, idx) {
          const localP = Math.max(0, Math.min(1, (progress - idx * 0.12) / 0.55));
          const ease = 1 - Math.pow(1 - localP, 3);
          const y = startY + idx * (cardH + gap);

          ctx.fillStyle = isDark ? "rgba(30, 41, 59, 0.9)" : "#ffffff";
          roundRect(ctx, 70, y, 940, cardH, 26);
          ctx.fill();
          if (!isDark) {
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          // Medaglione sigla partito
          const badgeBg = (it.color === "#0f294a" && isDark) ? "#1d4ed8" : it.color;
          ctx.fillStyle = badgeBg;
          ctx.beginPath();
          ctx.arc(150, y + cardH / 2, 46, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 28px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(it.sigla, 150, y + cardH / 2 + 10);
          ctx.textAlign = "left";

          // Nome partito
          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
          ctx.font = "900 38px sans-serif";
          ctx.fillText(it.name, 222, y + 76);

          // Barra
          const barY = y + cardH - 64;
          const barMaxW = 470;
          ctx.fillStyle = isDark ? "#0f172a" : "#e2e8f0";
          roundRect(ctx, 222, barY, barMaxW, 24, 12);
          ctx.fill();

          ctx.fillStyle = (it.color === "#0f294a" && isDark) ? "#38bdf8" : it.color;
          roundRect(ctx, 222, barY, Math.max(16, (it.val / maxVal) * barMaxW * ease), 24, 12);
          ctx.fill();

          // Percentuale
          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
          ctx.font = "900 54px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText((it.val * ease).toFixed(2).replace(".", ",") + "%", 975, y + 84);

          // Variazione
          let diffTxt = "= 0,00";
          let diffCol = isDark ? "#94a3b8" : "#64748b";
          if (it.diff > 0) { diffTxt = "▲ +" + it.diff.toFixed(2).replace(".", ","); diffCol = "#22c55e"; }
          else if (it.diff < 0) { diffTxt = "▼ " + it.diff.toFixed(2).replace(".", ","); diffCol = "#ef4444"; }
          ctx.fillStyle = diffCol;
          ctx.font = "800 32px sans-serif";
          ctx.fillText(diffTxt, 975, y + cardH - 42);
          ctx.textAlign = "left";
        });

        // Card bloccata per generare curiosità
        const lockY = startY + items.length * (cardH + gap);
        const lockAlpha = Math.max(0, Math.min(1, (progress - 0.45) / 0.4));
        drawLockedTeaserCard(
          ctx,
          lockY,
          isDark,
          "Altri 9 partiti e variazioni",
          "Scopri la classifica completa su brunorachiele.it",
          lockAlpha
        );
      }

      // === RENDER 2: GRADIMENTO LEADER ===
      if (currentTab === "leader") {
        const raw = document.getElementById("in-leader-data").value.trim();
        const showLock = document.getElementById("sel-leader-lock").value === "yes";
        const leaders = raw.split(/\r?\n/).map(function(line, i) {
          const p = line.split(/\t|;/).map(function(s) { return s.trim(); }).filter(Boolean);
          if (p.length < 2) return null;
          const val = parseFloat(p[1].replace(",", ".").replace("%", ""));
          const diff = p[2] ? parseFloat(p[2].replace(",", ".").replace("%", "")) : 0;
          if (isNaN(val)) return null;
          return {
            name: p[0],
            initials: getInitials(p[0]),
            val: val,
            diff: isNaN(diff) ? 0 : diff,
            color: LEADER_COLORS[i % LEADER_COLORS.length]
          };
        }).filter(Boolean).slice(0, 4);

        const maxVal = Math.max.apply(null, leaders.map(function(l) { return l.val; }).concat([50]));
        const cardH = 185;
        const gap = 22;

        leaders.forEach(function(ld, idx) {
          const localP = Math.max(0, Math.min(1, (progress - idx * 0.1) / 0.5));
          const ease = 1 - Math.pow(1 - localP, 3);
          const y = startY + idx * (cardH + gap);

          ctx.fillStyle = isDark ? "rgba(30, 41, 59, 0.9)" : "#ffffff";
          roundRect(ctx, 70, y, 940, cardH, 24);
          ctx.fill();
          if (!isDark) {
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          // Cerchio iniziale leader
          ctx.fillStyle = ld.color;
          ctx.beginPath();
          ctx.arc(148, y + cardH / 2, 44, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 30px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(ld.initials, 148, y + cardH / 2 + 11);
          ctx.textAlign = "left";

          // Nome leader
          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
          ctx.font = "900 38px sans-serif";
          ctx.fillText(ld.name, 218, y + 74);

          // Barra gradimento
          const barY = y + cardH - 60;
          const barMaxW = 475;
          ctx.fillStyle = isDark ? "#0f172a" : "#e2e8f0";
          roundRect(ctx, 218, barY, barMaxW, 22, 11);
          ctx.fill();

          ctx.fillStyle = ld.color;
          roundRect(ctx, 218, barY, Math.max(16, (ld.val / maxVal) * barMaxW * ease), 22, 11);
          ctx.fill();

          // Percentuale
          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
          ctx.font = "900 52px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText((ld.val * ease).toFixed(1).replace(".", ",") + "%", 975, y + 80);

          let diffTxt = "= 0,0";
          let diffCol = isDark ? "#94a3b8" : "#64748b";
          if (ld.diff > 0) { diffTxt = "▲ +" + ld.diff.toFixed(1).replace(".", ","); diffCol = "#22c55e"; }
          else if (ld.diff < 0) { diffTxt = "▼ " + ld.diff.toFixed(1).replace(".", ","); diffCol = "#ef4444"; }
          ctx.fillStyle = diffCol;
          ctx.font = "800 30px sans-serif";
          ctx.fillText(diffTxt, 975, y + cardH - 38);
          ctx.textAlign = "left";
        });

        if (showLock) {
          const lockY = startY + leaders.length * (cardH + gap);
          const lockAlpha = Math.max(0, Math.min(1, (progress - 0.5) / 0.4));
          drawLockedTeaserCard(
            ctx,
            lockY,
            isDark,
            "Tutti gli altri leader politici",
            "Consulta la rilevazione integrale su brunorachiele.it",
            lockAlpha
          );
        }
      }

      // === RENDER 3: SCENARI STABILICUM ===
      if (currentTab === "stabilicum") {
        const raw = document.getElementById("in-stab-data").value.trim();
        const stabColors = ["#0b4a9f", "#dc2626", "#475569", "#2563eb", "#16a34a"];
        const rows = raw.split(/\r?\n/).map(function(line, i) {
          const p = line.split(/\t|;/).map(function(s) { return s.trim(); }).filter(Boolean);
          if (p.length < 3) return null;
          const votes = parseFloat(p[1].replace(",", ".").replace("%", ""));
          const seats = parseInt(p[2], 10);
          if (isNaN(votes) || isNaN(seats)) return null;
          return {
            name: p[0],
            votes: votes,
            seats: seats,
            majority: seats >= 201,
            color: stabColors[i % stabColors.length]
          };
        }).filter(Boolean).slice(0, 4);

        const cardH = 225;
        const gap = 24;

        rows.forEach(function(rw, idx) {
          const localP = Math.max(0, Math.min(1, (progress - idx * 0.12) / 0.5));
          const ease = 1 - Math.pow(1 - localP, 3);
          const y = startY + idx * (cardH + gap);

          ctx.fillStyle = isDark ? "rgba(30, 41, 59, 0.92)" : "#ffffff";
          roundRect(ctx, 70, y, 940, cardH, 24);
          ctx.fill();

          if (rw.majority) {
            ctx.strokeStyle = "#22c55e";
            ctx.lineWidth = 5;
            ctx.stroke();
          } else if (!isDark) {
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          // Nome coalizione/lista
          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
          ctx.font = "900 34px sans-serif";
          ctx.fillText(rw.name, 106, y + 66);

          // Pill Voti %
          ctx.fillStyle = isDark ? "#0f172a" : "#f1f5f9";
          roundRect(ctx, 106, y + 86, 175, 44, 12);
          ctx.fill();
          ctx.fillStyle = isDark ? "#93c5fd" : "#0b4a9f";
          ctx.font = "800 26px sans-serif";
          ctx.fillText("Voti: " + rw.votes.toFixed(1).replace(".", ",") + "%", 122, y + 116);

          // Badge Maggioranza se >= 201 seggi
          if (rw.majority) {
            ctx.fillStyle = "#16a34a";
            roundRect(ctx, 298, y + 86, 260, 44, 12);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "900 22px sans-serif";
            ctx.fillText("✓ MAGGIORANZA", 322, y + 116);
          }

          // Seggi animati a destra
          const dispSeats = Math.round(rw.seats * ease);
          ctx.fillStyle = rw.majority ? "#22c55e" : (isDark ? "#ffffff" : "#0f172a");
          ctx.font = "900 62px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(dispSeats, 975, y + 86);
          ctx.fillStyle = isDark ? "#94a3b8" : "#64748b";
          ctx.font = "700 24px sans-serif";
          ctx.fillText("seggi su 400", 975, y + 120);
          ctx.textAlign = "left";

          // Barra seggi con tacca soglia 201
          const barX = 106;
          const barY = y + cardH - 54;
          const barMaxW = 868;
          ctx.fillStyle = isDark ? "#0f172a" : "#e2e8f0";
          roundRect(ctx, barX, barY, barMaxW, 24, 12);
          ctx.fill();

          const fillW = Math.max(14, (rw.seats / 400) * barMaxW * ease);
          ctx.fillStyle = rw.majority ? "#22c55e" : (rw.color === "#0b4a9f" && isDark ? "#38bdf8" : rw.color);
          roundRect(ctx, barX, barY, fillW, 24, 12);
          ctx.fill();

          // Tacca verticale soglia 201 seggi
          const threshX = barX + (201 / 400) * barMaxW;
          ctx.fillStyle = "#f59e0b";
          ctx.fillRect(threshX - 2, barY - 8, 4, 40);
        });

        // Legenda soglia 201
        const noteY = startY + rows.length * (cardH + gap) + 18;
        ctx.fillStyle = "#f59e0b";
        ctx.font = "800 26px sans-serif";
        ctx.fillText("▲ Linea gialla: Soglia maggioranza assoluta (201 seggi) • Premio al 42%", 70, noteY);
      }

      // Footer Call-to-Action
      ctx.fillStyle = "#2563eb";
      roundRect(ctx, 70, 1700, 940, 88, 24);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(ctaText, W / 2, 1755);
      ctx.textAlign = "left";
    }

    function playPreview(onComplete) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const duration = 9500;
      const start = performance.now();

      function step(now) {
        const p = Math.min(1, (now - start) / duration);
        drawFrame(p);
        if (p < 1) {
          animFrameId = requestAnimationFrame(step);
        } else if (onComplete) {
          onComplete();
        }
      }
      animFrameId = requestAnimationFrame(step);
    }

    function recordAndDownload() {
      const canvas = document.getElementById("tiktok-canvas");
      const status = document.getElementById("rec-status");
      const btn = document.getElementById("btn-record");

      if (!canvas.captureStream || typeof MediaRecorder === "undefined") {
        alert("Il tuo browser non supporta la registrazione diretta da Canvas. Usa Chrome o Edge su computer.");
        return;
      }

      btn.disabled = true;
      status.classList.remove("hidden");
      status.textContent = "Registrazione video in corso (11 secondi)... non cambiare scheda.";

      const stream = canvas.captureStream(30);
      const mimeTypes = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
      let selectedMime = "";
      for (let i = 0; i < mimeTypes.length; i++) {
        if (MediaRecorder.isTypeSupported(mimeTypes[i])) {
          selectedMime = mimeTypes[i];
          break;
        }
      }

      const recorder = selectedMime ? new MediaRecorder(stream, { mimeType: selectedMime, videoBitsPerSecond: 6000000 }) : new MediaRecorder(stream);
      const chunks = [];

      recorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = function() {
        const ext = selectedMime.indexOf("mp4") !== -1 ? "mp4" : "webm";
        const blob = new Blob(chunks, { type: selectedMime || "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "tiktok-" + currentTab + "-brunorachiele." + ext;
        a.click();

        status.textContent = "Video scaricato! Pronto da caricare su TikTok, Reels o Shorts.";
        btn.disabled = false;
      };

      recorder.start();
      playPreview(function() {
        setTimeout(function() {
          recorder.stop();
        }, 1200);
      });
    }

    init();
  </script>
