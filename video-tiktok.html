      <!-- PANNELLO 3: PRIME PAGINE (EDICOLA DEL GIORNO) -->

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

            <select id="sel-papers-preset" onchange="loadPapersImages()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold">

          <label class="text-[11px] font-bold uppercase text-slate-400">Coalizioni / Liste (Nome • Voti % • Seggi Camera su 400)</label>

        <textarea id="in-stab-data" rows="4" oninput="drawFrame(1)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-white">CAMPO LARGO&#9;44,5&#9;220
CENTRODESTRA&#9;43,6&#9;139
FUTURO NAZIONALE&#9;5,6&#9;18
AZIONE&#9;1,0&#9;3</textarea>
        <div class="grid grid-cols-2 gap-2">

      <div class="flex flex-wrap gap-2.5 pt-2">

    <!-- Anteprima Verticale 9:16 -->

      <div class="border-4 border-slate-800 rounded-[32px] overflow-hidden shadow-2xl bg-black" style="width: 342px; height: 608px;">
        <canvas id="tiktok-canvas" width="1080" height="1920" style="width: 342px; height: 608px; display: block;"></canvas>

  <script>
    const CSV_URL = "storico_supermedia_brunorachiele.csv";
    const SITE_LOGO_URL = "https://static.brunorachiele.it/logo.png";
    const PARTY_LOGOS_BASE = "https://grafici.brunorachiele.it/img/";
    const LEADER_PHOTOS_BASE = "https://static.brunorachiele.it/leader/";
    const COVERS_BASE = "https://static.brunorachiele.it/copertine/";

    const PARTY_CONFIG = {
      "Fratelli d'Italia": { sigla: "FdI", color: "#0f294a", logo: "fdi.png" },
      "Partito Democratico": { sigla: "PD", color: "#dc2626", logo: "pd.png" },
      "Movimento 5 Stelle": { sigla: "M5S", color: "#eab308", logo: "m5s.png" },
      "Forza Italia": { sigla: "FI", color: "#0284c7", logo: "fi.png" },
      "Lega": { sigla: "LEGA", color: "#16a34a", logo: "lega.png" },
      "Alleanza Verdi-Sinistra": { sigla: "AVS", color: "#15803d", logo: "avs.png" },
      "Azione": { sigla: "AZ", color: "#2563eb", logo: "azione.png" },
      "Italia Viva": { sigla: "IV", color: "#db2777", logo: "iv.png" },
      "+Europa": { sigla: "+EU", color: "#f59e0b", logo: "europa.png" },
      "Noi Moderati": { sigla: "NM", color: "#0ea5e9", logo: "nm.png" },
      "Futuro Nazionale": { sigla: "FN", color: "#475569", logo: "fn.png" },
      "Sud Chiama Nord": { sigla: "SCN", color: "#7c3aed", logo: "scn.png" }
    };

    const LEADER_FILES = {
      "meloni": { file: "meloni.jpeg", color: "#0f294a" },
      "tajani": { file: "tajani.jpg", color: "#0284c7" },
      "schlein": { file: "schlein.jpg", color: "#dc2626" },
      "conte": { file: "conte.jpg", color: "#eab308" },
      "salvini": { file: "salvini.jpg", color: "#16a34a" },
      "calenda": { file: "calenda.jpeg", color: "#2563eb" },
      "renzi": { file: "renzi.jpg", color: "#db2777" },
      "salis": { file: "salis.jpeg", color: "#15803d" },
      "vannacci": { file: "vannacci.jpeg", color: "#475569" }
    };

    const PAPER_NAMES = {
      "corriere-della-sera": "Corriere della Sera",
      "la-repubblica": "La Repubblica",
      "la-stampa": "La Stampa",
      "il-sole-24-ore": "Il Sole 24 Ore",
      "il-fatto-quotidiano": "Il Fatto Quotidiano",
      "il-giornale": "Il Giornale",
      "libero-quotidiano": "Libero Quotidiano",
      "la-verita": "La Verità",
      "il-tempo": "Il Tempo",
      "domani": "Domani",
      "the-new-york-times": "New York Times",
      "financial-times": "Financial Times",
      "le-monde": "Le Monde"
    };

    const LEADER_COLORS = ["#0b4a9f", "#0284c7", "#dc2626", "#eab308", "#16a34a", "#7c3aed", "#db2777"];
    const ACTIVE_KEYS = Object.keys(PARTY_CONFIG);

    const loadedImages = {};
    let loadedPapers = [];
    let currentTab = "partiti";
    let records = [];
    let selectedIndex = 0;
    let animFrameId = null;

    function preloadImage(key, url, fallbackUrl) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function() {
          loadedImages[key] = img;
          resolve(img);
        };
        img.onerror = function() {
          if (fallbackUrl) {
            preloadImage(key, fallbackUrl, null).then(resolve);
          } else {
            resolve(null);
          }
        };
        img.src = url;
      });
    }

    function getTodayItalyInfo() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(now);
      const m = {};
      parts.forEach(function(p) { m[p.type] = p.value; });
      return {
        iso: m.year + "-" + m.month + "-" + m.day,
        it: m.day + "/" + m.month + "/" + m.year
      };
    }

    async function loadPapersImages() {
      const slugs = document.getElementById("sel-papers-preset").value.split(",");
      const list = [];
      for (let i = 0; i < slugs.length; i++) {
        const slug = slugs[i].trim();
        const key = "paper_" + slug;
        const img = await preloadImage(
          key,
          COVERS_BASE + slug + ".webp?t=" + Date.now(),
          COVERS_BASE + slug + ".jpg?t=" + Date.now()
        );
        list.push({
          slug: slug,
          title: PAPER_NAMES[slug] || slug,
          img: img
        });
      }
      loadedPapers = list;
      drawFrame(1);
    }

    async function init() {
      const today = getTodayItalyInfo();
      document.getElementById("in-papers-date").value = "EDICOLA DEL " + today.it;

      const promises = [preloadImage("site_logo", SITE_LOGO_URL)];

      // Precarica loghi di tutti i 12 partiti
      ACTIVE_KEYS.forEach(function(k) {
        const cfg = PARTY_CONFIG[k];
        if (cfg.logo) {
          promises.push(preloadImage("party_" + cfg.logo, PARTY_LOGOS_BASE + cfg.logo));
        }
      });

      // Precarica foto reali di tutti i leader
      Object.keys(LEADER_FILES).forEach(function(lk) {
        const lf = LEADER_FILES[lk];
        promises.push(preloadImage("leader_" + lk, LEADER_PHOTOS_BASE + lf.file));
      });

      await Promise.all(promises);
      await loadPapersImages();

      try {
        const res = await fetch(CSV_URL + "?t=" + Date.now());
        const text = await res.text();
        const lines = text.trim().split(/\r?\n/);
        const headers = lines[0].split(",").map(function(h) { return h.trim(); });

        records = lines.slice(1).map(function(l) {
          const cols = l.split(",");
          const obj = {};
          headers.forEach(function(h, i) {
            const v = (cols[i] || "").trim();
            obj[h] = (h === "data" || h === "data_it") ? v : (v === "" ? null : parseFloat(v));
          });
          return obj;
        }).filter(function(r) {
          return r.data && r.data <= today.iso;
        }).sort(function(a, b) {
          return a.data.localeCompare(b.data);
        });

        const sel = document.getElementById("sel-date");
        records.slice().reverse().forEach(function(r, idx) {
          const opt = document.createElement("option");
          opt.value = records.length - 1 - idx;
          opt.textContent = "Supermedia del " + r.data_it;
          sel.appendChild(opt);
        });
        selectedIndex = records.length - 1;
      } catch (e) {}

      drawFrame(1);
    }

    function switchTab(tab) {
      currentTab = tab;
      ["partiti", "leader", "primepagine", "stabilicum"].forEach(function(t) {
        const btn = document.getElementById("tab-" + t);
        const panel = document.getElementById("panel-" + t);
        if (t === tab) {
          btn.className = "tab-btn py-2.5 px-2 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow";
          panel.classList.remove("hidden");
        } else {
          btn.className = "tab-btn py-2.5 px-2 rounded-lg text-xs font-extrabold text-slate-400 hover:text-white";
          panel.classList.add("hidden");
        }
      });

      if (tab === "partiti") {
        onPartitiModeChange();
      } else if (tab === "primepagine") {
        document.getElementById("in-hook").value = "LE PRIME PAGINE DEI GIORNALI DI OGGI IN EDICOLA";
        document.getElementById("in-cta").value = "Sfoglia tutte le 21 copertine HD su brunorachiele.it";
      } else if (tab === "leader") {
        document.getElementById("in-hook").value = "CHI È IL LEADER PIÙ APPREZZATO DAGLI ITALIANI?";
        document.getElementById("in-cta").value = "Classifica completa del gradimento su brunorachiele.it";
      } else if (tab === "stabilicum") {
        document.getElementById("in-hook").value = "CHI AVREBBE LA MAGGIORANZA CON LO STABILICUM?";
        document.getElementById("in-cta").value = "Tutti gli scenari e i seggi su brunorachiele.it";
      }
      drawFrame(1);
    }

    function onDateChange() {
      selectedIndex = parseInt(document.getElementById("sel-date").value, 10);
      drawFrame(1);
    }

    function onPartitiModeChange() {
      const sub = document.getElementById("sel-partiti-submode").value;
      if (sub === "top3") {
        document.getElementById("in-hook").value = "SONDAGGI POLITICI: ECCO IL PODIO DELLA SETTIMANA";
      } else if (sub === "duello") {
        document.getElementById("in-hook").value = "TESTA A TESTA NEI SONDAGGI: CHI È DAVANTI?";
      } else {
        document.getElementById("in-hook").value = "CHI SALE E CHI SCENDE NEI SONDAGGI OGGI";
      }
      document.getElementById("in-cta").value = "Tutti i partiti e lo storico dal 2020 su brunorachiele.it";
      drawFrame(1);
    }

    function loadStabPreset(val) {
      const ta = document.getElementById("in-stab-data");
      if (val === "s1") {
        ta.value = "CAMPO LARGO\t44,5\t220\nCENTRODESTRA\t43,6\t139\nFUTURO NAZIONALE\t5,6\t18\nAZIONE\t1,0\t3";
      } else if (val === "s2") {
        ta.value = "CENTRODESTRA + FN\t49,2\t220\nCAMPO LARGO\t38,3\t122\nITALIA VIVA\t6,1\t20\nAZIONE\t1,0\t3";
      } else {
        ta.value = "CENTRODESTRA + FN\t49,2\t220\nCAMPO LARGO + TERZO POLO\t45,5\t145";
      }
      drawFrame(1);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      let curY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, curY);
          line = words[n] + " ";
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, curY);
      return curY;
    }

    function getInitials(name) {
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 3).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    // Disegna medaglione circolare: mode="logo" (con margine su fondo bianco) oppure mode="photo" (ritratto a pieno cerchio)
    function drawCircularAvatar(ctx, cx, cy, radius, img, fallbackText, bgColor, borderColor, mode) {
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.32)";
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 5;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = img ? "#ffffff" : bgColor;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius - 3, 0, Math.PI * 2);
      ctx.clip();

      if (img) {
        if (mode === "photo") {
          // Ritratto leader centrato in alto (cover crop)
          const r = radius - 3;
          const d = r * 2;
          const aspect = img.width / img.height;
          let drawW = d, drawH = d, offsetX = 0, offsetY = 0;
          if (aspect > 1) {
            drawW = d * aspect;
            offsetX = -(drawW - d) / 2;
          } else {
            drawH = d / aspect;
            offsetY = -(drawH - d) * 0.15; // mantiene il volto centrato
          }
          ctx.drawImage(img, cx - r + offsetX, cy - r + offsetY, drawW, drawH);
        } else {
          const pad = radius * 0.22;
          const size = (radius - pad) * 2;
          ctx.drawImage(img, cx - radius + pad, cy - radius + pad, size, size);
        }
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 " + Math.round(radius * 0.56) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(fallbackText, cx, cy + Math.round(radius * 0.2));
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = borderColor || "#ffffff";
      ctx.lineWidth = 5;
      ctx.stroke();
    }

    function drawBackgroundStudio(ctx, W, H, isDark) {
      if (isDark) {
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, "#050b18");
        grad.addColorStop(0.5, "#0b1936");
        grad.addColorStop(1, "#060d1f");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        const glow1 = ctx.createRadialGradient(180, 260, 20, 180, 260, 520);
        glow1.addColorStop(0, "rgba(37, 99, 235, 0.28)");
        glow1.addColorStop(1, "rgba(37, 99, 235, 0)");
        ctx.fillStyle = glow1;
        ctx.fillRect(0, 0, W, H);

        const glow2 = ctx.createRadialGradient(900, 1450, 20, 900, 1450, 520);
        glow2.addColorStop(0, "rgba(14, 165, 233, 0.20)");
        glow2.addColorStop(1, "rgba(14, 165, 233, 0)");
        ctx.fillStyle = glow2;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
        ctx.lineWidth = 1;
        for (let gx = 0; gx < W; gx += 60) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
        }
        for (let gy = 0; gy < H; gy += 60) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#f1f5f9";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#0b4a9f";
        ctx.fillRect(0, 0, W, 520);
      }
    }

    function drawLockedTeaserCard(ctx, y, isDark, labelText, subText, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = isDark ? "rgba(15, 23, 42, 0.72)" : "#ffffff";
      roundRect(ctx, 64, y, 952, 150, 26);
      ctx.fill();

      ctx.setLineDash([12, 8]);
      ctx.strokeStyle = isDark ? "#38bdf8" : "#0b4a9f";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#2563eb";
      ctx.beginPath();
      ctx.arc(146, y + 75, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🔒", 146, y + 86);
      ctx.textAlign = "left";

      ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
      ctx.font = "900 33px sans-serif";
      ctx.fillText(labelText, 212, y + 68);

      ctx.fillStyle = isDark ? "#38bdf8" : "#0b4a9f";
      ctx.font = "700 26px sans-serif";
      ctx.fillText(subText, 212, y + 108);
      ctx.restore();
    }

    function drawFrame(progress) {
      const canvas = document.getElementById("tiktok-canvas");

      }

      // Badge Live a destra
      let badgeRight = "SUPERMEDIA";

      }

      ctx.fillStyle = "#dc2626";
      roundRect(ctx, 526, 110, 490, 72, 36);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(562, 146, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "900 24px sans-serif";
      ctx.fillText(badgeRight.slice(0, 27), 584, 155);

      // Titolo Hook
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 58px sans-serif";

      const startY = endTitleY + 56;
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(64, startY - 26, 160, 8);

      // === 1. SONDAGGI PARTITI (CON LOGHI REALI) ===
      if (currentTab === "partiti" && records[selectedIndex]) {
        const cur = records[selectedIndex];
        const prev = selectedIndex > 0 ? records[selectedIndex - 1] : null;
        const submode = document.getElementById("sel-partiti-submode").value;

        let items = ACTIVE_KEYS.filter(function(k) {
          return cur[k] !== null && cur[k] !== undefined;
        }).map(function(k) {
          const v = cur[k];
          const pv = prev ? prev[k] : null;
          const diff = (pv !== null && pv !== undefined) ? +(v - pv).toFixed(2) : 0;
          const cfg = PARTY_CONFIG[k];

            name: k,
            sigla: cfg.sigla,
            val: v,
            diff: diff,
            color: cfg.color,
            img: cfg.logo ? loadedImages["party_" + cfg.logo] : null
          };
        });

        if (submode === "movers3") {
          items = items.filter(function(it) { return it.diff !== 0; })
            .sort(function(a, b) { return Math.abs(b.diff) - Math.abs(a.diff); })
            .slice(0, 3);
        } else {
          items.sort(function(a, b) { return b.val - a.val; });
          items = items.slice(0, submode === "duello" ? 2 : 3);
        }

        const maxVal = Math.max.apply(null, items.map(function(it) { return it.val; }).concat([30]));

        items.forEach(function(it, idx) {

          const ease = 1 - Math.pow(1 - localP, 3);
          const y = startY + idx * (cardH + gap);

          ctx.fillStyle = isDark ? "rgba(15, 23, 42, 0.88)" : "#ffffff";
          roundRect(ctx, 64, y, 952, cardH, 28);
          ctx.fill();

          ctx.strokeStyle = isDark ? "rgba(56, 189, 248, 0.25)" : "#cbd5e1";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.fillStyle = it.color;
          roundRect(ctx, 64, y, 18, cardH, 10);
          ctx.fill();

          drawCircularAvatar(ctx, 156, y + cardH / 2, 54, it.img, it.sigla, it.color, it.color, "logo");

          ctx.fillStyle = idx === 0 ? "#f59e0b" : (isDark ? "#334155" : "#e2e8f0");

          ctx.fillStyle = idx === 0 ? "#0f172a" : (isDark ? "#ffffff" : "#0f172a");

          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";

          roundRect(ctx, 234, barY, barMaxW, 24, 12);

          ctx.fillStyle = (it.color === "#0f294a" && isDark) ? "#38bdf8" : it.color;
          roundRect(ctx, 234, barY, Math.max(18, (it.val / maxVal) * barMaxW * ease), 24, 12);
          ctx.fill();

          ctx.fillStyle = isDark ? "#ffffff" : "#0f172a";
          ctx.font = "900 56px sans-serif";

          ctx.fillText((it.val * ease).toFixed(2).replace(".", ",") + "%", 982, y + 84);

      // === 2. GRADIMENTO LEADER (CON FOTO REALI DA static.brunorachiele.it/leader/) ===

        const maxVal = Math.max.apply(null, leaders.map(function(l) { return l.val; }).concat([50]));
        const cardH = 195;

        leaders.forEach(function(ld, idx) {

          drawCircularAvatar(ctx, 152, y + cardH / 2, 54, ld.img, ld.initials, ld.color, ld.color, "photo");

            ctx.fillStyle = "#ffffff";

          }

          const dispSeats = Math.round(rw.seats * ease);

      ctx.font = "900 32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(ctaText + "  →", W / 2, 1755);
      ctx.textAlign = "left";
    }

    function playPreview(onComplete) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const duration = 9500;
      const start = performance.now();

      function step(now) {
        const p = Math.min(1, (now - start) / duration);
        drawFrame(p);
        if (p < 1) {
          animFrameId = requestAnimationFrame(step);
        } else if (onComplete) {
          onComplete();
        }
      }
      animFrameId = requestAnimationFrame(step);
    }

    function recordAndDownload() {
      const canvas = document.getElementById("tiktok-canvas");
      const status = document.getElementById("rec-status");
      const btn = document.getElementById("btn-record");

      if (!canvas.captureStream || typeof MediaRecorder === "undefined") {
        alert("Il tuo browser non supporta la registrazione diretta da Canvas. Usa Chrome o Edge su computer.");
        return;
      }

      btn.disabled = true;
      status.classList.remove("hidden");
      status.textContent = "Registrazione video HD in corso (11 secondi)... non cambiare scheda.";

      const stream = canvas.captureStream(30);
      const mimeTypes = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
      let selectedMime = "";
      for (let i = 0; i < mimeTypes.length; i++) {
        if (MediaRecorder.isTypeSupported(mimeTypes[i])) {
          selectedMime = mimeTypes[i];
          break;
        }
      }

      const recorder = selectedMime ? new MediaRecorder(stream, { mimeType: selectedMime, videoBitsPerSecond: 8000000 }) : new MediaRecorder(stream);
      const chunks = [];

      recorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = function() {
        const ext = selectedMime.indexOf("mp4") !== -1 ? "mp4" : "webm";
        const blob = new Blob(chunks, { type: selectedMime || "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "tiktok-" + currentTab + "-brunorachiele." + ext;
        a.click();

        status.textContent = "Video HD scaricato! Pronto da caricare su TikTok, Reels o Shorts.";
        btn.disabled = false;
      };

      recorder.start();
      playPreview(function() {
        setTimeout(function() {
          recorder.stop();
        }, 1200);
      });
    }

    init();
  </script>
</body>
</html>
